server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  location / {
    try_files $uri $uri/ /index.html;
  }

  location /api/ {
    # optional proxy to backend if you want to route API through nginx
    # proxy_pass http://backend:8000/;
    # proxy_set_header Host $host;
    # proxy_set_header X-Real-IP $remote_addr;
    try_files $uri $uri/ =404;
  }

  # Serve gzip and caching headers for static assets
  location ~* \.(?:css|js|json|map|png|jpg|jpeg|gif|svg|ico)$ {
    expires 30d;
    add_header Cache-Control "public, must-revalidate";
  }
}
