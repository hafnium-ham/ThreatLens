services:
  clickhouse:
    image: clickhouse/clickhouse-server:24.8
    environment:
      CLICKHOUSE_DB: threatlens
      CLICKHOUSE_USER: threatlens
      CLICKHOUSE_PASSWORD: threatlens
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
    ports:
      - "8123:8123"
      - "9000:9000"
    volumes:
      - clickhouse-data:/var/lib/clickhouse
      - ./clickhouse/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8123/ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  app:
    build:
      context: ./backend
    env_file:
      - path: .env
        required: false
    environment:
      GROQ_MODEL: llama-3.3-70b-versatile
      LANGFUSE_SECRET_KEY: sk-lf-6a33a259-b83c-4b7e-87cd-8e4fb98cd392
      LANGFUSE_PUBLIC_KEY: pk-lf-d40e7060-7d7e-4dc2-9535-6ed81326461e
      LANGFUSE_BASE_URL: https://us.cloud.langfuse.com
      LANGFUSE_PROJECT_URL: https://us.cloud.langfuse.com
      CLICKHOUSE_HOST: ycvc8ozito.us-west-2.aws.clickhouse.cloud
      CLICKHOUSE_PORT: 8443
      CLICKHOUSE_DB: default
      CLICKHOUSE_USER: default
      CLICKHOUSE_PASSWORD: .GTexzm1mE8z5
      CLICKHOUSE_SECURE: "true"
      FRONTEND_ORIGIN: http://localhost:5173
    ports:
      - "8000:8000"
    depends_on:
      clickhouse:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
    environment:
      VITE_API_BASE_URL: http://localhost:8000
      VITE_WS_URL: ws://localhost:8000/ws/feed
      VITE_LANGFUSE_HOST: https://us.cloud.langfuse.com
    ports:
      - "5173:5173"
    depends_on:
      - app

volumes:
  clickhouse-data:
